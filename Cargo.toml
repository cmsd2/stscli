[package]
authors = ["Chris Dawes <cmsd2@cantab.net>"]
license = "Apache-2.0"
name = "stscli"
version = "0.4.0"
edition = "2024"
categories = ["authentication", "command-line-interface"]
description = "CLI to get temporary session tokens from Amazon's AWS STS Api."
repository = "https://github.com/cmsd2/stscli"
keywords = ["AWS", "STS", "cli", "token", "role"]

[dependencies]
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-runtime = "1.10.2"
# Not the default features: they include the legacy `rustls` client, which
# brings hyper 0.14 and rustls 0.21 and the advisories against them.
aws-sdk-sts = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
rust-ini = "0.21.3"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
