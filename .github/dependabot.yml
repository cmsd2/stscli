# Weekly updates for the crates and for the actions, whose SHA pins this moves
# along with their version comments. Every update waits seven days after a
# release, so a compromised release has time to be found and pulled first.
# Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
